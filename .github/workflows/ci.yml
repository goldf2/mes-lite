name: MES-lite CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - "ci/**"

permissions:
  contents: read

concurrency:
  group: mes-lite-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: file:./mes-lite-ci.db
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Fetch production audit baseline
        run: git fetch --no-tags --depth=1 origin be7e18f653bd684cb2367985c1f8c072801d79ec

      - name: Use Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and smoke-test multi-engine CAD preview image
        run: |
          set +e
          docker buildx build \
            --progress=plain \
            --load \
            --cache-from type=gha,scope=cad-preview \
            --cache-to type=gha,mode=max,scope=cad-preview \
            -f services/cad-preview/Dockerfile \
            -t mes-lite-cad-preview:${{ github.sha }} \
            . 2>&1 | tee /tmp/cad-preview-build.log
          build_status=${PIPESTATUS[0]}
          set -e
          if (( build_status != 0 )); then
            details=$(tail -n 35 /tmp/cad-preview-build.log | sed 's/%/%25/g; s/\r/%0D/g' | awk 'BEGIN { ORS="%0A" } { print }')
            echo "::error file=services/cad-preview/Dockerfile,title=CAD preview image build failed::$details"
            exit "$build_status"
          fi

      - name: Validate and generate Prisma client
        run: |
          npx prisma validate
          npx prisma generate

      - name: Production build
        run: npm run build

      - name: Verify application recovery drill
        run: npm run verify:application-recovery-drill

      - name: Run domain and governance regression baseline
        env:
          SOP_DIFF_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'HEAD^' }}
        run: npm run verify:ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint
